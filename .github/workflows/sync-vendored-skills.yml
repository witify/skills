name: Sync vendored skills

on:
  schedule:
    - cron: "0 9 * * 1" # Mondays 09:00 UTC
  workflow_dispatch:

concurrency: ${{ github.workflow }}

jobs:
  sync:
    name: Sync from upstreams
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync vendored skills
        run: ./scripts/sync-vendored-skills.sh

      - name: Commit and push to main
        run: |
          if git diff --quiet -- skills/; then
            echo "All vendored skills up to date."
            exit 0
          fi

          cat > ".changeset/sync-vendored-skills-${{ github.run_id }}.md" <<'EOF'
          ---
          "witify-skills": patch
          ---

          Sync vendored skills from their upstream repos.
          EOF

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add skills/ .changeset/
          git commit -m "chore: sync vendored skills from upstream"
          git push
