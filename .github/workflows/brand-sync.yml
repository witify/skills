name: Brand sync

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  check:
    name: Brand copies match brand/
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check that skill copies match their brand/ sources
        run: scripts/sync-brand.sh --check
