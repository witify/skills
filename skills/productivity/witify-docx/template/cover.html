<!doctype html>
<html>
<head>
<style>
@page { size: 850px 1100px; margin: 0; }
* { print-color-adjust: exact; -webkit-print-color-adjust: exact; }
@font-face {
  font-family: 'Aptos';
  font-weight: 400;
  src: local('Aptos'),
       url('file:///Applications/Microsoft Word.app/Contents/Resources/DFonts/Aptos.ttf');
}
@font-face {
  font-family: 'Aptos';
  font-weight: 700;
  src: local('Aptos Bold'), local('Aptos-Bold'),
       url('file:///Applications/Microsoft Word.app/Contents/Resources/DFonts/Aptos-Bold.ttf');
}
body { margin: 0; font-family: 'Aptos', 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif; -webkit-font-smoothing: antialiased; }
</style>
</head>
<body>
<div style="width:850px;height:1100px;background:#1C2B30;position:relative;overflow:hidden;box-sizing:border-box">

  <img src="assets/witify-icon-tonal.svg"
       style="position:absolute;right:-210px;bottom:-120px;width:760px">

  <img src="assets/logo-light.svg"
       style="position:absolute;top:64px;left:72px;width:168px">

  <div style="position:absolute;left:72px;top:440px">
    <div style="width:64px;height:4px;background:#FF4746;margin-bottom:36px"></div>
    <div style="font-size:58px;font-weight:700;letter-spacing:-0.02em;color:#FFFFFF;line-height:1.06">
      {{TITLE_HTML}}
    </div>
    <div style="font-size:20px;color:#AEBDC2;margin-top:26px">
      {{SUBTITLE}}
    </div>
  </div>

  <div style="position:absolute;left:72px;bottom:76px;font-size:13px">
    <div style="font-weight:700;color:#FFFFFF;margin-bottom:8px">{{META_LINE}}</div>
    <div style="color:#8FA0A6">Witify Technologies · witify.io</div>
  </div>

</div>
</body>
</html>
